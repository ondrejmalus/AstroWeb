<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>AstroWeb – Editace</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Admin CSS -->
  <link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="admin-container">

  <!-- HEADER -->
  <div class="admin-header">

    <h1>Editace obsahu</h1>

    <div class="admin-header-buttons">

      <button class="btn-back" onclick="goTo('welcome')">
        ← Zpět
      </button>

      <button class="btn-logout" onclick="logout()">
        Odhlásit se
      </button>

    </div>

  </div>


  <!-- SUCCESS / ERROR BOX -->
  <div id="globalSuccess" class="admin-success"></div>
  <div id="globalError" class="admin-error"></div>


  <!-- ===================== GALERIE ===================== -->

  <div class="admin-section">

    <h2>Galerie</h2>

    <input
      type="text"
      id="gallerySearch"
      class="form-control mb-3"
      placeholder="🔍 Hledat snímek..."
    >

    <div class="table-wrapper">

      <table class="table admin-table align-middle">

        <thead>
          <tr>
            <th>Náhled</th>
            <th>Název</th>
            <th>Kategorie</th>
            <th>Souhvězdí</th>
            <th>Akce</th>
          </tr>
        </thead>

        <tbody id="galleryTableBody">
          <!-- admin.js -->
        </tbody>

      </table>
    </div>

  </div>


  <!-- ===================== NOVINKY ===================== -->

  <div class="admin-section">

    <h2>Novinky</h2>

    <input
      type="text"
      id="newsSearch"
      class="form-control mb-3"
      placeholder="🔍 Hledat článek..."
    >

    <div class="table-wrapper">

      <table class="table admin-table align-middle">

        <thead>
          <tr>
            <th>Název</th>
            <th>Datum</th>
            <th>Akce</th>
          </tr>
        </thead>

        <tbody id="newsTableBody">
          <!-- admin.js -->
        </tbody>

      </table>

    </div>

  </div>


  <!-- ===================== ZAJÍMAVOSTI ===================== -->

  <div class="admin-section">

    <h2>Zajímavosti</h2>

    <input
      type="text"
      id="factsSearch"
      class="form-control mb-3"
      placeholder="🔍 Hledat zajímavost..."
    >

    <div class="table-wrapper">

      <table class="table admin-table align-middle">

        <thead>
          <tr>
            <th>Kategorie</th>
            <th>Název</th>
            <th>Akce</th>
          </tr>
        </thead>

        <tbody id="factsTableBody">
          <!-- admin.js -->
        </tbody>

      </table>

    </div>

  </div>


</div>


<!-- ===================== MODALS ===================== -->


<!-- EDIT GALERIE -->
<div class="modal fade" id="editGalleryModal">

  <div class="modal-dialog modal-lg modal-dialog-centered">

    <div class="modal-content admin-modal">

      <div class="modal-header">
        <h5>Upravit snímek</h5>
      </div>

      <div class="modal-body">

        <input type="hidden" id="edit-id">

        <div class="mb-2">
          <label>Název</label>
          <input id="edit-name" class="form-control">
        </div>

        <div class="mb-2">
          <label>Běžný název</label>
          <input id="edit-common-name" class="form-control">
        </div>

        <div class="mb-2">
          <label>Souhvězdí</label>
          <input id="edit-constellation" class="form-control">
        </div>

        <div class="mb-2">
          <label>Zajímavost</label>
          <textarea id="edit-fact" class="form-control"></textarea>
        </div>

        <div class="mb-2">
          <label>Nový obrázek</label>
          <input type="file" id="edit-image" class="form-control">
        </div>

      </div>

      <div class="modal-footer">

        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Zrušit
        </button>

        <button class="btn btn-admin-action" onclick="saveEdit()">
          Uložit změny
        </button>

      </div>

    </div>

  </div>

</div>


<!-- EDIT NEWS -->
<div class="modal fade" id="editNewsModal">

  <div class="modal-dialog modal-lg modal-dialog-centered">

    <div class="modal-content admin-modal">

      <div class="modal-header">
        <h5>Upravit článek</h5>
      </div>

      <div class="modal-body">

        <input type="hidden" id="edit-news-id">

        <input id="edit-news-title" class="form-control mb-2">

        <textarea id="edit-news-content" class="form-control mb-2"></textarea>

        <input type="file" id="edit-news-image" class="form-control">

      </div>

      <div class="modal-footer">

        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Zrušit
        </button>

        <button class="btn btn-admin-action" onclick="saveNewsEdit()">
          Uložit změny
        </button>

      </div>

    </div>

  </div>

</div>


<!-- EDIT FACT -->
<div class="modal fade" id="editFactModal">

  <div class="modal-dialog modal-lg modal-dialog-centered">

    <div class="modal-content admin-modal">

      <div class="modal-header">
        <h5>Upravit zajímavost</h5>
      </div>

      <div class="modal-body">

        <input type="hidden" id="edit-fact-id">

        <select id="edit-fact-category" class="form-select mb-2">
          <option value="general">Všeobecná</option>
          <option value="personality">Osobnost</option>
        </select>

        <input id="edit-fact-title" class="form-control mb-2">

        <textarea id="edit-fact-text" class="form-control mb-2"></textarea>

        <input type="file" id="edit-fact-image" class="form-control">

      </div>

      <div class="modal-footer">

        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Zrušit
        </button>

        <button class="btn btn-admin-action" onclick="saveFactEdit()">
          Uložit změny
        </button>

      </div>

    </div>

  </div>

</div>


<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Admin logic -->
<script src="admin.js"></script>

<!-- TOAST CONTAINER -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">

  <div
    id="successToast"
    class="toast align-items-center text-bg-success border-0"
    role="alert"
  >
    <div class="d-flex">
      <div class="toast-body" id="successToastText">
        Úspěch
      </div>

      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        data-bs-dismiss="toast">
      </button>
    </div>
  </div>

</div>

</body>
</html>
