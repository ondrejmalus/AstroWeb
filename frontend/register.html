<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroWeb – Registrace</title>
  <link rel="icon" type="image/png" href="data/web_images/icon.png">

  <!-- Vlastní CSS -->
  <link href="assets/css/style.css" rel="stylesheet">

  <!-- Bootswatch Lux -->
  <link href="assets/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="assets/fonts/fontawesome/css/all.min.css">
</head>
<body class="body">

<!-- HLAVNÍ OBSAH -->
<main class="container mt-5 content">

  <div class="login-box">
    <h2 class="login-title">Registrace</h2>
    <form id="registerForm" class="login-form">
  <input type="text" id="regUsername" class="login-input" placeholder="Uživatelské jméno" required>
  <input type="email" id="regEmail" class="login-input" placeholder="E-mail" required>
  <div class="password-wrapper">
    <input type="password" id="regPassword" class="login-input" placeholder="Heslo" required minlength="8">
    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
  </div>
  <div class="password-wrapper">
    <input type="password" id="regConfirm" class="login-input" placeholder="Potvrď heslo" required>
    <i class="fas fa-eye toggle-password" id="toggleConfirm"></i>
  </div>
  <button type="submit" class="login-btn">Zaregistrovat se</button>
</form>
<p class="login-register">
    Již máte účet? <a href="/login">Přihlaste se</a>
  </p>
<p id="regMsg" class="login-msg"></p>
  </div>

</main>  

<!-- FOOTER -->
<div id="footer"></div>

<script src="layout/navbar.js"></script>

<script>
document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const username = document.getElementById('regUsername').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  const confirm = document.getElementById('regConfirm').value;
  const msg = document.getElementById('regMsg');

  let msgTimeout;

function showMessage(text, type = "error") {
  const msg = document.getElementById("regMsg");

  msg.textContent = text;

  msg.classList.remove("success-msg", "error-msg");

  if (type === "success") {
    msg.classList.add("success-msg");
  } else {
    msg.classList.add("error-msg");
  }

  clearTimeout(msgTimeout);

  msgTimeout = setTimeout(() => {
    msg.textContent = "";
  }, 2500);
}

  // --- Ověření hesla ---
  if (password.length < 8) {
    showMessage("Heslo musí mít alespoň 8 znaků.");
    return;
  }
  if (password !== confirm) {
    showMessage("Zadaná hesla se musí shodovat.");
    return;
  }

  try {
      const res = await fetch('/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password, confirm })
    });
    const data = await res.json();

    if (res.ok) {
      showMessage('Registrace úspěšná, nyní se přihlaste.', 'success');
      setTimeout(() => location.href = '/login', 1500);
    } else {
      showMessage(data.msg);
    }
  } catch (err) {
    showMessage('Chyba serveru');
    console.error(err);
  }
});

  // --- Přepínání viditelnosti hesel ---
  function setupToggle(inputId, toggleId) {
    const input = document.getElementById(inputId);
    const toggle = document.getElementById(toggleId);

    toggle.addEventListener('click', () => {
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";
      toggle.classList.toggle('fa-eye');
      toggle.classList.toggle('fa-eye-slash');
    });
  }

  setupToggle('regPassword', 'togglePassword');
  setupToggle('regConfirm', 'toggleConfirm');
  
</script>


<!-- Načítání footeru -->
<script>
fetch('./layout/footer.html')
  .then(res => res.text())
  .then(data => document.getElementById('footer').innerHTML = data);
</script>

<!-- Tlačítko Zpět nahoru -->
<button onclick="scrollToTop()" id="scrollTopBtn" title="Zpět nahoru">
  <i class="fas fa-arrow-up"></i>
</button>

<script>
window.onscroll = function () {
  const btn = document.getElementById("scrollTopBtn");
  if (document.body.scrollTop > 500 || document.documentElement.scrollTop > 500) {
    btn.style.display = "block";
  } else {
    btn.style.display = "none";
  }
};

function scrollToTop() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
