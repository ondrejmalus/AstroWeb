<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroWeb – Astrostatistika</title>
  <link rel="icon" type="image/png" href="data/web_images/icon.png">
  
  <!-- Vlastní CSS -->
  <link href="assets/css/style.css" rel="stylesheet">

  <!-- Bootswatch Lux -->
  <link href="assets/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="assets/fonts/fontawesome/css/all.min.css">
</head>
<body class="body">

<!-- HLAVNÍ OBSAH -->
<main class="container mt-5 content-about">

    <h1 class="mb-4 stats-header" style="margin-top: 70px;text-align: center;">Astro statistika</h1>

    <p class="mb-5" style="color: black;font-size: 1.5rem; text-align: center;">
    Stránka astrostatistiky zobrazuje souhrnné informace o astronomických
    objektech a aktivitě uživatelů na AstroWebu.
    </p>

    <!-- KOMUNITA -->
    <section class="mb-5 statistics">
    <h3 class="mb-3 stats-h3">Komunita AstroWebu</h3>
    <div class="row g-3" id="stats-community"></div>
    </section>

    <!-- GALERIE -->
    <section class="mb-5 statistics">
    <h3 class="mb-3 stats-h3">Obsah galerie</h3>
    <div class="row g-3" id="stats-gallery"></div>
    </section>

    <!-- TYPY OBJEKTŮ -->
    <section class="mb-5 statistics">
    <h3 class="mb-3 stats-h3">Typy objektů</h3>
    <div class="row g-3" id="stats-types"></div>
    </section>

    <!-- ZAJÍMAVOSTI -->
    <section class="mb-5 statistics">
    <h3 class="mb-3 stats-h3">Zajímavosti</h3>
    <div class="row g-3" id="stats-interesting"></div>
    </section>

    <!-- TOP OBJEKTY -->
    <section class="mb-5 statistics">
    <h3 class="mb-3 stats-h3">Top objekty</h3>
    <div class="row g-3" id="stats-top"></div>
    </section>

</main>  

<!-- FOOTER (načtený dynamicky) -->
<div id="footer"></div>

<script src="layout/navbar.js"></script>

<!-- Načítání layoutu -->
<script>
  // Footer
  fetch('./layout/footer.html')
    .then(res => res.text())
    .then(data => document.getElementById('footer').innerHTML = data);
</script>

<!-- Tlačítko Zpět nahoru -->
<button onclick="scrollToTop()" id="scrollTopBtn" title="Zpět nahoru">
  <i class="fas fa-arrow-up"></i>
</button>

<script>
  // Ukázat tlačítko při scrollu
  window.onscroll = function () {
    const btn = document.getElementById("scrollTopBtn");
    if (document.body.scrollTop > 500 || document.documentElement.scrollTop > 500) {
      btn.style.display = "block";
    } else {
      btn.style.display = "none";
    }
  };

  // Funkce pro scroll nahoru
  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

<script src="layout/astrostatistics.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
