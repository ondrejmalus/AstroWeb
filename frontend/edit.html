<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroWeb – Editace</title>
  <link rel="icon" type="image/png" href="data/web_images/icon.png">
  
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/fonts/fontawesome/css/all.min.css">
</head>

<body class="body edit-page">

<!-- SIDEBAR (STEJNÝ JAKO NA UPLOADU) -->
<aside class="admin-sidebar-simple">
  <h2 class="admin-title">Administrace</h2>

  <nav class="admin-nav">

    <a href="#gallery" class="active">
      <i class="fas fa-images"></i> Galerie
    </a>

    <a href="#news">
      <i class="fas fa-newspaper"></i> Novinky
    </a>

    <a href="#facts">
      <i class="fas fa-lightbulb"></i> Zajímavosti
    </a>

    <hr>
        <a class="edit-link" href="upload.html">
      <i class="fas fa-upload"></i> Přidávání
    </a>
  </nav>
</aside>

<main class="container mt-5 content">

  <h1 id="gallery" class="upload-header">Editace galerie</h1>

  <!-- VYHLEDÁVÁNÍ -->
  <div class="mb-4">
    <input
      type="text"
      id="searchInput"
      class="form-control"
      placeholder="🔍 Hledat podle názvu, souhvězdí, kategorie…"
    >
  </div>

  <!-- TABULKA -->
<div class="table-wrapper">
  <table class="table table-striped table-hover align-middle admin-table">
    <thead class="table-dark">
      <tr>
        <th>Náhled</th>
        <th>Název</th>
        <th>Obecný název</th>
        <th>Kategorie</th>
        <th>Souhvězdí</th>
        <th>Akce</th>
      </tr>
    </thead>
    <tbody id="galleryTableBody">
      <!-- JS -->
    </tbody>
  </table>
</div>

<!-- MODAL – EDITACE SNÍMKU -->
<div class="modal fade" id="editGalleryModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content bg-light">

      <div class="modal-header">
        <h5 class="modal-title">Upravit snímek</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="edit-id">

        <div class="mb-3">
          <label class="form-label">Název (odborný)</label>
          <input type="text" id="edit-name" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Obecný název</label>
          <input type="text" id="edit-common-name" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Souhvězdí</label>
          <input type="text" id="edit-constellation" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Zajímavost</label>
          <textarea id="edit-fact" rows="4" class="form-control"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Nový obrázek (nepovinné)</label>
          <input type="file" id="edit-image" class="form-control" accept="image/*">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Zrušit</button>
        <button class="btn btn-success" onclick="saveEdit()">Uložit změny</button>
      </div>

    </div>
    </div>
  </div>

<!-- NOVINKY -->
<h2 id="news" class="admin-section-title mt-5">Editace novinek</h2>

<input
  type="text"
  id="newsSearch"
  class="form-control mb-3"
  placeholder="Hledat článek..."
>

<div class="table-wrapper">
  <table class="table table-hover align-middle">
    <thead class="table-dark">
      <tr>
        <th>Název</th>
        <th>Datum</th>
        <th>Akce</th>
      </tr>
    </thead>
    <tbody id="newsTableBody"></tbody>
  </table>
</div>

<div class="modal fade" id="editNewsModal">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Editace článku</h5>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-news-id">

        <input id="edit-news-title" class="form-control mb-2">
        <textarea id="edit-news-content" class="form-control mb-2"></textarea>

        <input type="file" id="edit-news-image" class="form-control">
      </div>
        <div class="modal-footer">
          <button class="btn btn-cancel" data-bs-dismiss="modal">
            Zrušit
          </button>
          <button class="btn btn-save" onclick="saveNewsEdit()">
            Uložit
          </button>
        </div>
    </div>
  </div>
</div>

<!-- ZAJÍMAVOSTI -->
<h2 id="facts" class="admin-section-title mt-5">Editace zajímavostí</h2>

<input
  type="text"
  id="factsSearch"
  class="form-control mb-3"
  placeholder="Hledat zajímavost..."
>

<div class="table-wrapper">
  <table class="table table-hover align-middle">
    <thead class="table-dark">
      <tr>
        <th>Kategorie</th>
        <th>Název</th>
        <th>Akce</th>
      </tr>
    </thead>
    <tbody id="factsTableBody"></tbody>
  </table>
</div>

<div class="modal fade" id="editFactModal">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Editace zajímavosti</h5>
      </div>

      <div class="modal-body">
        <input type="hidden" id="edit-fact-id">

        <select id="edit-fact-category" class="form-select mb-2">
          <option value="general">Všeobecná</option>
          <option value="personality">Osobnost</option>
        </select>

        <input id="edit-fact-title" class="form-control mb-2">
        <textarea id="edit-fact-text" class="form-control mb-2" rows="6"></textarea>

        <input type="file" id="edit-fact-image" class="form-control">
      </div>

      <div class="modal-footer">
        <button class="btn btn-cancel" data-bs-dismiss="modal">
          Zrušit
        </button>
        <button class="btn btn-save" onclick="saveFactEdit()">
          Uložit
        </button>
      </div>
    </div>
  </div>
</div>

</main>

<!-- FOOTER -->
<div id="footer"></div>
</body>

<script src="assets/bootstrap/bootstrap.bundle.min.js"></script>
<script src="layout/edit.js"></script>
<script src="layout/navbar.js"></script>
<script src="layout/upload.js"></script>

<script>
  fetch('./layout/footer.html')
    .then(res => res.text())
    .then(data => document.getElementById('footer').innerHTML = data);
</script>

<!-- Scroll nahoru -->
<button onclick="scrollToTop()" id="scrollTopBtn" title="Zpět nahoru">
  <i class="fas fa-arrow-up"></i>
</button>

<script>
  window.onscroll = function () {
    const btn = document.getElementById("scrollTopBtn");
    btn.style.display = (document.documentElement.scrollTop > 500) ? "block" : "none";
  };
  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</html>
