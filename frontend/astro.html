<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroWeb – Galerie</title>
  <link rel="icon" type="image/png" href="data/web_images/icon.png">
  
  <!-- CSS -->
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/fonts/fontawesome/css/all.min.css">
</head>
<body class="gallery-page">

  <div id="particles-js"></div>

  <!-- === SIDEBAR VLEVO === -->
<aside id="sidebar" class="astro-sidebar">
  <h3 class="sidebar-title"><i class="fas fa-layer-group"></i> Průvodce</h3>
  <ul id="sidebarList" class="sidebar-list"></ul>
</aside>


  <!-- === PRAVÝ SIDEBAR S FILTRY === -->
<div class="astro-sidebar-right">

  <div class="filter-section sticky-search">
    <label class="filter-label">🔍 Vyhledávání</label>
    <input type="text" id="searchInput" class="filter-input" placeholder="Hledat název...">
  </div>

  <div class="top-controls">
    <button id="showTopNewest" class="top-btn">Top 10 nejnovějších</button>
    <button id="showTopRated" class="top-btn">Top 10 nejlépe hodnocených</button>
    <button id="showAll" class="top-btn" style="margin-top:50px;">Zobrazit vše / Zrušit filtry</button>
  </div>

  <div class="filter-section">
    <label class="filter-label">Kategorie</label>
    <div id="filterCategory"></div>
  </div>

  <div class="filter-section">
    <label class="filter-label">Podkategorie</label>
    <div id="filterSubcategory"></div>
  </div>

  <div class="filter-section">
    <label class="filter-label">Souhvězdí</label>
    <div id="filterConstellation"></div>
  </div>

  <div class="filter-section">
    <label class="filter-label">Katalogy</label>

    <label class="filter-checkbox">
      <input type="checkbox" class="catalogCheck" value="messier"> Messier
    </label>
    <label class="filter-checkbox">
      <input type="checkbox" class="catalogCheck" value="ngc"> NGC
    </label>
    <label class="filter-checkbox">
      <input type="checkbox" class="catalogCheck" value="ic"> IC
    </label>
  </div>

</div>

<button class="gallery-toggle left" onclick="toggleLeftSidebar()">
  <i class="fas fa-compass"></i>
</button>

<button class="gallery-toggle right" onclick="toggleRightSidebar()">
  <i class="fas fa-filter"></i>
</button>

<main class="container mt-5 content">

<!-- úvod -->
<section class="gallery-hero text-center py-4">

  <div class="hero-content">

    <h1 style="margin-top:70px;">Astronomická galerie</h1>

    <p class="hero-lead">
      Sbírka mých originálních astronomických snímků pořízených mým teleskopem.
    </p>

    <div class="hero-actions mt-3">
        <a id="stats" href="/astrostatistics" class="astro-stats">Astronomické statistiky</a>

      <button id="randomImageBtn" class="btn btn-outline-light ms-2">
        Náhodný snímek
      </button>
    </div>

  </div>

</section>

  <div id="gallery"></div>
  <div id="topResults"></div>
</main>

<!-- MODÁL -->
<div class="modal fade" id="imageModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zavřít"></button>
      <div class="modal-body text-center">
        <img id="modalImage" src="" class="img-fluid rounded mb-3" alt="">
        <h5 class="modal-title" id="modalTitle"></h5>
        <p class="popis-main"><strong>Popis:</strong> <span id="modalDescription" class="modal-description"></span></p>
        <p><strong>Kategorie:</strong> <span id="modalType"></span></p>
        <p><strong>Souhvězdí:</strong> <span id="modalConstellation"></span></p>
        <p><strong>Vzdálenost (ly):</strong> <span id="modalDistance"></span></p>
        <p>
          <span id="likeBtn" class="like-btn">
            <i class="fas fa-thumbs-up"></i> <span id="likeCount">0</span>
          </span>
        </p>
          <p>
            <button id="moreImagesBtn" class="btn btn-outline-info btn-sm d-none">
              Zobrazit více snímků
            </button>
          </p>
        <div class="d-flex justify-content-between mt-3">
          <button id="prevBtn" class="btn btn-secondary">← Předchozí</button>
          <button id="nextBtn" class="btn btn-secondary">Další →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODÁL – DALŠÍ SNÍMKY -->
<div class="modal fade" id="extraImagesModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content bg-dark text-light">

      <div class="modal-header">
        <h5 class="modal-title">
          Další snímky objektu
          <span id="extraImagesCount" class="text-warning ms-2"></span>
        </h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div id="extraImagesGrid" class="row g-4">
          <!-- JS -->
        </div>
      </div>

    </div>
  </div>
</div>

<!-- FOOTER -->
<div id="footer"></div>
<script src="layout/navbar.js"></script>
<script>
  fetch('./layout/footer.html')
    .then(res => res.text())
    .then(data => document.getElementById('footer').innerHTML = data);
</script>

<!-- Scroll Top -->
<button onclick="scrollToTop()" id="scrollTopBtn" title="Zpět nahoru">
  <i class="fas fa-arrow-up"></i>
</button>
<script>
  const scrollBtn = document.getElementById("scrollTopBtn");

  window.onscroll = function () {
    scrollBtn.style.display = (document.documentElement.scrollTop > 500) ? "block" : "none";
  };

  function scrollToTop() { 
    window.scrollTo({ top: 0, behavior: 'smooth' }); 
  }

  // Posun šipky
  if (document.body.classList.contains('gallery-page')) {
    scrollBtn.style.right = '280px';
  }

function toggleLeftSidebar() {
  document.querySelector('.astro-sidebar-right')
    .classList.remove('mobile-open');

  document.querySelector('.astro-sidebar')
    .classList.toggle('mobile-open');
}

function toggleRightSidebar() {
  document.querySelector('.astro-sidebar')
    .classList.remove('mobile-open');

  document.querySelector('.astro-sidebar-right')
    .classList.toggle('mobile-open');
}

document.addEventListener('click', e => {
  if (window.innerWidth >= 992) return;

  const leftSidebar = document.querySelector('.astro-sidebar');
  const rightSidebar = document.querySelector('.astro-sidebar-right');
  const leftBtn = document.querySelector('.gallery-toggle.left');
  const rightBtn = document.querySelector('.gallery-toggle.right');

  // klik mimo levý sidebar
  if (
    leftSidebar.classList.contains('mobile-open') &&
    !leftSidebar.contains(e.target) &&
    !leftBtn.contains(e.target)
  ) {
    leftSidebar.classList.remove('mobile-open');
  }

  // klik mimo pravý sidebar
  if (
    rightSidebar.classList.contains('mobile-open') &&
    !rightSidebar.contains(e.target) &&
    !rightBtn.contains(e.target)
  ) {
    rightSidebar.classList.remove('mobile-open');
  }
});

 // Zavření levého sidebaru po kliknutí na odkaz (mobil)
document.querySelector('.astro-sidebar').addEventListener('click', e => {
  if (window.innerWidth >= 992) return;

  // pokud se kliklo na odkaz nebo jeho potomka
  if (e.target.closest('a')) {
    document
      .querySelector('.astro-sidebar')
      .classList.remove('mobile-open');
  }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<script>
particlesJS("particles-js", {
  particles: {
    number: { value: 60 },

    color: { value: "#5F5F5F" },

    shape: { type: "circle" },

    opacity: {
      value: 0.8
    },

    size: {
      value: 4
    },

    line_linked: {
      enable: false
    },

    move: {
      enable: true,
      speed: 0.2
    }
  },

  interactivity: {
    enable: false
  },

  retina_detect: true
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="layout/astro.js"></script>
</body>
</html>
