<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroWeb – Zajímavosti</title>
  <link rel="icon" type="image/png" href="data/web_images/icon.png">
  
  <!-- Vlastní CSS -->
  <link href="assets/css/style.css" rel="stylesheet">

  <!-- Bootswatch Lux -->
  <link href="assets/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="assets/fonts/fontawesome/css/all.min.css">

<style>
.fact-detail {
  max-width: 1000px;
  margin: 40px auto;
  padding: 30px;
  margin-top: 100px;
  background: linear-gradient(180deg, #0f1b2d, #0a1422);
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  animation: fadeIn 0.5s ease;
}

.fact-grid {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 40px;
  align-items: start;
}

.fact-left {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

#factTitle {
  font-size: 2rem;
  color: #ffd86b;
  font-weight: 700;
}

#factCategory {
  font-size: 0.8rem;
  text-transform: uppercase;
  color: #00d4ff;
}

#factImage {
  width: 100%;
  border-radius: 12px;
  margin-top: 10px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.5);
}

.fact-right {
  background: rgba(15, 25, 45, 0.6);
  padding: 25px;
  border-radius: 12px;
  border: 1px solid rgba(0, 212, 255, 0.2);
}

.fact-text {
  font-size: 1.05rem;
  line-height: 1.8;
  color: #d0d6e0;
}

.fact-back .btn {
  border-radius: 10px;
  padding: 8px 16px;
  border: 1px solid #00d4ff;
  color: #00d4ff;
  transition: 0.2s;
}

.fact-back .btn:hover {
  background: #00d4ff;
  color: #000;
}

@media (max-width: 768px) {
  .fact-grid {
    grid-template-columns: 1fr;
  }

  .fact-detail {
    padding: 25px;
  }

  #factTitle {
    font-size: 1.6rem;
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>

</head>

<body class="body">

<!-- HLAVNÍ OBSAH -->
<main class="container mt-5 content-about">

<div class="fact-detail">

  <div class="fact-grid">

    <!-- LEVÁ STRANA -->
    <div class="fact-left">
      <h1 id="factTitle"></h1>

      <p id="factCategory" class="fact-category"></p>

      <img id="factImage" class="img-fluid rounded d-none">

      <div class="fact-back mt-4">
        <a href="/facts-page" class="btn btn-outline-info">
          ← Zpět
        </a>
      </div>
    </div>

    <!-- PRAVÁ STRANA -->
    <div class="fact-right">
      <p id="factText" class="fact-text"></p>
    </div>

  </div>

</div>

</main>

<!-- FOOTER (načtený dynamicky) -->
<div id="footer"></div>

<script src="layout/fact-detail.js"></script>
<script src="layout/navbar.js"></script>
<script src="layout/facts.js"></script>

<!-- Načítání layoutu -->
<script>
  // Footer
  fetch('./layout/footer.html')
    .then(res => res.text())
    .then(data => document.getElementById('footer').innerHTML = data);
</script>

<!-- Tlačítko Zpět nahoru -->
<button onclick="scrollToTop()" id="scrollTopBtn" title="Zpět nahoru">
  <i class="fas fa-arrow-up"></i>
</button>

<script>
  // Ukázat tlačítko při scrollu
  window.onscroll = function () {
    const btn = document.getElementById("scrollTopBtn");
    if (document.body.scrollTop > 500 || document.documentElement.scrollTop > 500) {
      btn.style.display = "block";
    } else {
      btn.style.display = "none";
    }
  };

  // Funkce pro scroll nahoru
  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
