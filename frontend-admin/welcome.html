<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>AstroWeb – Administrace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">

</head>

<body>

  <div class="login-card admin-panel">

    <div class="login-header">
      <h1>Administrace AstroWeb</h1>
      <p>Vyber akci, kterou chceš provést</p>
    </div>

    <div class="admin-actions">

      <button class="btn-admin primary" onclick="goTo('upload')">
        <span class="icon">➕</span>
        <div>
          <div class="title">Přidat nový obsah</div>
          <div class="desc">Nahrát nový snímek, článek nebo zajímavost</div>
        </div>
      </button>

      <button class="btn-admin secondary" onclick="goTo('edit')">
        <span class="icon">✏️</span>
        <div>
          <div class="title">Upravit obsah</div>
          <div class="desc">Editovat existující záznamy v databázi</div>
        </div>
      </button>

    </div>

    <button class="btn-logout" onclick="logout()">
      Odhlásit se
    </button>

    <div class="login-footer">
      AstroWeb Admin • <span>Electron Desktop App</span>
    </div>

  </div>

  <script src="admin.js"></script>

</body>
</html>
