<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>AstroWeb – Admin login</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap (jen CSS, ideální pro Electron) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      height: 100vh;
      background: radial-gradient(circle at top, #1d3252, #0b1220);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #f0f1f2;
      color: #000;
      border-radius: 12px;
      padding: 35px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
    }

    .login-title {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .login-subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 30px;
    }

    .form-label {
      font-weight: 500;
    }

    .form-control {
      background: #cecece;
      border-radius: 6px;
      padding: 10px;
    }

    .form-control:focus {
      background: #e0e0e0;
      border-color: #1d3252;
      box-shadow: 0 0 5px rgba(29,50,82,0.5);
    }

    .btn-login {
      background: #1d3252;
      color: #fff;
      padding: 12px;
      font-weight: 500;
      border-radius: 6px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.35);
      background: #243f68;
    }

    .footer-text {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-title">AstroWeb – Administrace</div>
    <div class="login-subtitle">Přihlášení do administrační části</div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Uživatelské jméno</label>
        <input
          type="text"
          id="username"
          class="form-control"
          placeholder="admin"
          required
        >
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Heslo</label>
        <input
          type="password"
          id="password"
          class="form-control"
          placeholder="••••••••"
          required
        >
      </div>

      <button type="submit" class="btn btn-login w-100">
        Přihlásit se
      </button>
    </form>

    <div class="footer-text">
      AstroWeb Admin • Electron prototyp
    </div>
  </div>

  <script>
    // PROTOTYP – zatím jen fake login
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // TODO: později nahradíš IPC / API voláním
      if (username && password) {
        alert('✔️ Přihlášení (prototyp)');
        console.log('LOGIN:', { username, password });

        // example:
        // window.location.href = 'index.html';
      }
    });
  </script>

</body>
</html>
